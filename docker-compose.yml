services:
  antigravity-mcp:
    build:
      context: .
      dockerfile: Dockerfile.antigravity
    container_name: antigravity-mcp
    # host mode: DDS discovery/traffic from the host's native ROS2 driver does not
    # traverse a docker bridge network, so this container must share the host netns.
    network_mode: "host"
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    env_file:
      - .env
    stdin_open: true
    tty: true
    volumes:
      - ./ros-mcp-server/robot_specifications:/app/ros-mcp-server/robot_specifications
      - antigravity-config:/root/.gemini

  rosbridge:
    build:
      context: .
      dockerfile: Dockerfile.rosbridge
    container_name: rosbridge
    network_mode: "host"
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    restart: unless-stopped

volumes:
  antigravity-config: