services:
  ros-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.ros-mcp-server
    container_name: ros-mcp-server
    network_mode: "host"
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    restart: unless-stopped
    volumes:
      # Caminho depende da versão do Python da imagem base (ubuntu:22.04 -> python3.10).
      - ./ros-mcp-server/robot_specifications:/opt/venv/lib/python3.10/site-packages/robot_specifications

  rosbridge:
    build:
      context: .
      dockerfile: Dockerfile.rosbridge
    container_name: rosbridge
    network_mode: "host"
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    restart: unless-stopped